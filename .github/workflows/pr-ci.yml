name: PR CI

on:
  pull_request:
    branches:
      - "2.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip wheel
          .venv/bin/python -m pip install -r requirements.txt

      - name: Check Python sources
        run: .venv/bin/python -B -m compileall backend scripts

      - name: Build frontend
        working-directory: app
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Prepare Tauri check resources
        run: |
          mkdir -p app/src-tauri/bin
          touch app/src-tauri/bin/shanten-backend.exe

      - name: Check Tauri backend
        working-directory: app/src-tauri
        run: cargo check
