name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release with the artifacts"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows portable
            os: windows-latest
            artifact_name: shanten-lens-windows-portable
            artifact_path: Shanten-Lens_*_windows-portable.zip
          - name: macOS DMG
            os: macos-14
            artifact_name: shanten-lens-macos-dmg
            artifact_path: Shanten-Lens_*_macos-*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer ~/.cargo/bin over Homebrew rustup-init (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Create virtual environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m venv .venv

      - name: Create virtual environment (macOS)
        if: runner.os == 'macOS'
        run: python3 -m venv .venv

      - name: Build Windows portable
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build_all.bat

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
