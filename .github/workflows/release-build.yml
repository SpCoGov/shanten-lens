name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to rebuild (blank uses the selected ref)"
        type: string
        default: ""
      publish_release:
        description: "Publish a GitHub release with the artifacts"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS installer
            os: windows-latest
            artifact_name: shanten-lens-windows-nsis
            artifact_path: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/nsis/*.sig
          - name: macOS DMG
            os: macos-14
            artifact_name: shanten-lens-macos-dmg
            artifact_path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Validate release tag
        if: github.event_name == 'push' || inputs.publish_release || inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e 'const version = require("fs").readFileSync("Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1]; if (!version || process.env.RELEASE_REF_TYPE !== "tag" || process.env.RELEASE_TAG !== "v" + version) { throw new Error("Publish requires the v" + version + " tag"); }'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prefer ~/.cargo/bin over Homebrew rustup-init (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build signed Windows NSIS installer
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts\build_all.bat

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updater manifest
        run: node scripts/update-manifest.mjs artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          make_latest: legacy
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
