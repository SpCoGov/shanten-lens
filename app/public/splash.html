<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>向听镜 正在启动…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        :root {
            --bg-0: #f8fafc;
            --bg-1: #eef4ff;
            --text-strong: #0f172a;
            --text-muted: #64748b;
            --track: rgba(148, 163, 184, 0.22);
            --fill-a: #2563eb;
            --fill-b: #60a5fa;
            --ring: rgba(37, 99, 235, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.2), transparent 34%),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 32%),
                linear-gradient(160deg, var(--bg-0), var(--bg-1));
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-strong);
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        ::selection {
            background: transparent;
            color: inherit;
        }

        .drag-layer {
            position: fixed;
            inset: 0;
            -webkit-app-region: drag;
            z-index: 0;
        }

        .no-drag {
            -webkit-app-region: no-drag;
        }

        .shell {
            width: min(420px, calc(100vw - 56px));
            position: relative;
            z-index: 1;
        }

        .layout {
            padding: 8px 6px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 60px;
            height: 60px;
            display: block;
            flex: 0 0 auto;
        }

        .brand-title {
            font-size: 28px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .brand-subtitle {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .status-label {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 6px;
        }

        .status-detail {
            min-height: 20px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .progress-wrap {
            margin-top: 28px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            position: relative;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--track);
        }

        .progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 10%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--fill-a), var(--fill-b));
            box-shadow: 0 0 0 1px rgba(255,255,255,0.24) inset, 0 8px 18px var(--ring);
            transition: width 320ms ease;
        }

        .progress-fill.indeterminate::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 36%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0));
            animation: shimmer 1.4s ease-in-out infinite;
        }

        .foot {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.42);
            box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(12px);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.12);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes shimmer {
            from {
                transform: translateX(-140%);
            }
            to {
                transform: translateX(340%);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.92);
                opacity: 0.78;
            }
        }
    </style>
</head>
<body>
<div class="drag-layer"></div>

<div class="shell no-drag">
    <div class="layout">
        <div class="brand">
            <img class="brand-mark" src="/logo.svg" alt="Shanten Lens logo"/>
            <div>
                <div class="brand-title">向听镜</div>
                <div class="brand-subtitle">Shanten Lens</div>
            </div>
        </div>

        <div class="status-label" id="status-label">正在准备启动</div>
        <div class="status-detail" id="status-detail">初始化窗口与运行环境</div>

        <div class="progress-wrap">
            <div class="progress-meta">
                <span id="phase-text">启动流程</span>
                <span id="eta-text">预计还需约 8 秒</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="foot">
            <span class="badge"><span class="dot"></span><span id="percent-text">8%</span></span>
            <span id="elapsed-text">已等待 0 秒</span>
        </div>
    </div>
</div>

<script>
    const startedAt = Date.now();
    const progressFill = document.getElementById("progress-fill");
    const statusLabel = document.getElementById("status-label");
    const statusDetail = document.getElementById("status-detail");
    const phaseText = document.getElementById("phase-text");
    const etaText = document.getElementById("eta-text");
    const percentText = document.getElementById("percent-text");
    const elapsedText = document.getElementById("elapsed-text");

    const phaseLabels = {
        bootstrap: "初始化应用",
        starting_backend: "启动后台",
        waiting_backend: "等待后台就绪",
        backend_ready: "后台已连接",
        i18n: "加载语言与配置",
        render: "构建主界面",
        render_wait_backend: "等待后台连接",
        ready: "准备完成",
        fallback: "超时兜底"
    };

    let current = {
        phase: "bootstrap",
        label: "正在准备启动",
        detail: "初始化窗口与运行环境",
        progress: 0.08,
        eta_seconds: 8,
        indeterminate: false
    };

    function clampProgress(value) {
        return Math.max(0.04, Math.min(1, Number(value) || 0));
    }

    function formatEta(seconds) {
        if (seconds == null) return "预计仍在处理中";
        if (seconds <= 0) return "马上完成";
        if (seconds < 60) return `预计还需约 ${seconds} 秒`;
        const minutes = Math.ceil(seconds / 60);
        return `预计还需约 ${minutes} 分钟`;
    }

    function render() {
        const progress = clampProgress(current.progress);
        const percent = Math.round(progress * 100);
        statusLabel.textContent = current.label || "正在启动";
        statusDetail.textContent = current.detail || "请稍候";
        phaseText.textContent = phaseLabels[current.phase] || "启动流程";
        etaText.textContent = formatEta(current.eta_seconds);
        percentText.textContent = `${percent}%`;
        elapsedText.textContent = `已等待 ${Math.max(0, Math.round((Date.now() - startedAt) / 1000))} 秒`;
        progressFill.style.width = `${percent}%`;
        progressFill.classList.toggle("indeterminate", !!current.indeterminate);
    }

    function update(payload) {
        if (!payload || typeof payload !== "object") return;
        current = {
            ...current,
            ...payload,
            progress: Math.max(current.progress || 0, clampProgress(payload.progress))
        };
        render();
    }

    async function initTauriProgressBridge() {
        const tauri = window.__TAURI__;
        if (!tauri?.core || !tauri?.event) {
            render();
            return;
        }

        try {
            const snapshot = await tauri.core.invoke("get_startup_progress");
            update(snapshot);
        } catch (_) {
        }

        try {
            await tauri.event.listen("startup:progress", (event) => update(event.payload));
        } catch (_) {
        }

        render();
    }

    render();
    window.setInterval(render, 1000);
    initTauriProgressBridge();
</script>
</body>
</html>
