<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>Shanten Lens</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        :root {
            --bg-0: #f8fafc;
            --bg-1: #eef4ff;
            --text-strong: #0f172a;
            --text-muted: #64748b;
            --track: rgba(148, 163, 184, 0.22);
            --fill-a: #2563eb;
            --fill-b: #60a5fa;
            --ring: rgba(37, 99, 235, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.2), transparent 34%),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 32%),
                linear-gradient(160deg, var(--bg-0), var(--bg-1));
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-strong);
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        ::selection {
            background: transparent;
            color: inherit;
        }

        .drag-layer {
            position: fixed;
            inset: 0;
            -webkit-app-region: drag;
            z-index: 0;
        }

        .no-drag {
            -webkit-app-region: no-drag;
        }

        .shell {
            width: min(420px, calc(100vw - 56px));
            position: relative;
            z-index: 1;
        }

        .layout {
            padding: 8px 6px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 60px;
            height: 60px;
            display: block;
            flex: 0 0 auto;
        }

        .brand-title {
            font-size: 28px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0.01em;
        }

        .brand-subtitle {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .status-label {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 6px;
        }

        .status-detail {
            min-height: 20px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .progress-wrap {
            margin-top: 28px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            position: relative;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: var(--track);
        }

        .progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 10%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--fill-a), var(--fill-b));
            box-shadow: 0 0 0 1px rgba(255,255,255,0.24) inset, 0 8px 18px var(--ring);
            transition: width 320ms ease;
        }

        .progress-fill.indeterminate::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 36%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.8), rgba(255,255,255,0));
            animation: shimmer 1.4s ease-in-out infinite;
        }

        .foot {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.42);
            box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(12px);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.12);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes shimmer {
            from {
                transform: translateX(-140%);
            }
            to {
                transform: translateX(340%);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.92);
                opacity: 0.78;
            }
        }
    </style>
</head>
<body>
<div class="drag-layer"></div>

<div class="shell no-drag">
    <div class="layout">
        <div class="brand">
            <img class="brand-mark" src="/logo.svg" alt=""/>
            <div>
                <div class="brand-title" id="brand-title"></div>
                <div class="brand-subtitle">Shanten Lens</div>
            </div>
        </div>

        <div class="status-label" id="status-label"></div>
        <div class="status-detail" id="status-detail"></div>

        <div class="progress-wrap">
            <div class="progress-meta">
                <span id="phase-text"></span>
                <span id="eta-text"></span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="foot">
            <span class="badge"><span class="dot"></span><span id="percent-text">8%</span></span>
            <span id="elapsed-text"></span>
        </div>
    </div>
</div>

<script>
    const startedAt = Date.now();
    const locale = (localStorage.getItem("sl-lang") || navigator.language || "zh-CN").toLowerCase().startsWith("ja") ? "ja" : "zh";
    const messages = {
        zh: {
            brand: "向听镜", starting: "正在准备启动", wait: "请稍候", detail: "初始化窗口与运行环境", flow: "启动流程",
            etaUnknown: "预计仍在处理中", etaNow: "马上完成", etaSeconds: (value) => `预计还需约 ${value} 秒`,
            etaMinutes: (value) => `预计还需约 ${value} 分钟`, elapsed: (value) => `已等待 ${value} 秒`,
            phases: {bootstrap: "初始化应用", starting_backend: "启动后台", waiting_backend: "等待后台就绪", backend_ready: "后台已连接", i18n: "加载语言与配置", render: "构建主界面", render_wait_backend: "等待后台连接", ready: "准备完成", fallback: "超时兜底"},
            details: {bootstrap: "初始化窗口与运行环境", starting_backend: "正在启动内嵌后端", waiting_backend: "正在等待内嵌后端就绪", backend_ready: "内嵌后端已就绪", i18n: "检测系统语言并初始化界面文案", render: "挂载首屏组件并连接事件", render_wait_backend: "正在等待内嵌后端连接", ready: "即将显示主窗口", fallback: "启动时间较长，正在继续处理"}
        },
        ja: {
            brand: "向聴レンズ", starting: "起動準備中", wait: "しばらくお待ちください", detail: "ウィンドウと実行環境を初期化しています", flow: "起動処理",
            etaUnknown: "処理を続けています", etaNow: "まもなく完了します", etaSeconds: (value) => `残り約 ${value} 秒`,
            etaMinutes: (value) => `残り約 ${value} 分`, elapsed: (value) => `${value} 秒経過`,
            phases: {bootstrap: "アプリを初期化", starting_backend: "バックエンドを起動", waiting_backend: "バックエンドを待機", backend_ready: "バックエンド接続済み", i18n: "言語と設定を読み込み", render: "メイン画面を構築", render_wait_backend: "バックエンド接続を待機", ready: "準備完了", fallback: "起動処理を継続中"},
            details: {bootstrap: "ウィンドウと実行環境を初期化しています", starting_backend: "内蔵バックエンドを起動しています", waiting_backend: "内蔵バックエンドの準備を待っています", backend_ready: "内蔵バックエンドの準備ができました", i18n: "システム言語を検出し、表示文言を初期化しています", render: "初期画面を表示し、イベントに接続しています", render_wait_backend: "内蔵バックエンドへの接続を待っています", ready: "メインウィンドウを表示します", fallback: "起動に時間がかかっています。処理を続けています"}
        }
    };
    const msg = messages[locale];
    document.documentElement.lang = locale === "ja" ? "ja-JP" : "zh-CN";
    document.title = `${msg.brand} · ${msg.starting}`;
    document.getElementById("brand-title").textContent = msg.brand;
    const progressFill = document.getElementById("progress-fill");
    const statusLabel = document.getElementById("status-label");
    const statusDetail = document.getElementById("status-detail");
    const phaseText = document.getElementById("phase-text");
    const etaText = document.getElementById("eta-text");
    const percentText = document.getElementById("percent-text");
    const elapsedText = document.getElementById("elapsed-text");

    let current = {
        phase: "bootstrap",
        progress: 0.08,
        eta_seconds: 8,
        indeterminate: false
    };

    function clampProgress(value) {
        return Math.max(0.04, Math.min(1, Number(value) || 0));
    }

    function formatEta(seconds) {
        if (seconds == null) return msg.etaUnknown;
        if (seconds <= 0) return msg.etaNow;
        if (seconds < 60) return msg.etaSeconds(seconds);
        const minutes = Math.ceil(seconds / 60);
        return msg.etaMinutes(minutes);
    }

    function render() {
        const progress = clampProgress(current.progress);
        const percent = Math.round(progress * 100);
        statusLabel.textContent = msg.phases[current.phase] || msg.starting;
        statusDetail.textContent = msg.details[current.phase] || msg.wait;
        phaseText.textContent = msg.phases[current.phase] || msg.flow;
        etaText.textContent = formatEta(current.eta_seconds);
        percentText.textContent = `${percent}%`;
        elapsedText.textContent = msg.elapsed(Math.max(0, Math.round((Date.now() - startedAt) / 1000)));
        progressFill.style.width = `${percent}%`;
        progressFill.classList.toggle("indeterminate", !!current.indeterminate);
    }

    function update(payload) {
        if (!payload || typeof payload !== "object") return;
        current = {
            ...current,
            ...payload,
            progress: Math.max(current.progress || 0, clampProgress(payload.progress))
        };
        render();
    }

    async function initTauriProgressBridge() {
        const tauri = window.__TAURI__;
        if (!tauri?.core || !tauri?.event) {
            render();
            return;
        }

        try {
            const snapshot = await tauri.core.invoke("get_startup_progress");
            update(snapshot);
        } catch (_) {
        }

        try {
            await tauri.event.listen("startup:progress", (event) => update(event.payload));
        } catch (_) {
        }

        render();
    }

    render();
    window.setInterval(render, 1000);
    initTauriProgressBridge();
</script>
</body>
</html>
