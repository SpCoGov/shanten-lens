[package]
name = "shanten-backend"
version.workspace = true
edition = "2021"
autobins = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
anyhow = "1"
base64 = "0.22"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
lettre = "0.11"
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hudsucker = { version = "0.24", default-features = false, features = ["rcgen-ca", "rustls-client", "http2"] }
